apiVersion: v1
kind: Pod
metadata:
  name: gpu-training
  namespace: ai-team-a
  labels:
    workload: gpu-training
spec:
  priorityClassName: ai-batch
  restartPolicy: Never
  containers:
    - name: training
      image: busybox:1.36
      command: ["sh", "-c", "echo GPU assigned; sleep 3600"]
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
          nvidia.com/gpu: "1"
        limits:
          cpu: 300m
          memory: 128Mi
          nvidia.com/gpu: "1"
