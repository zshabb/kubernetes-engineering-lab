apiVersion: v1
kind: LimitRange
metadata:
  name: container-defaults
  namespace: ai-team-a
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 64Mi
      default:
        cpu: 500m
        memory: 256Mi
---
