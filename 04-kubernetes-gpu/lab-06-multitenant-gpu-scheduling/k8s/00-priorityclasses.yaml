apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: ai-interactive
value: 100000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: Interactive inference jobs; higher priority than batch.
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: ai-batch
value: 1000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: Lower priority training and batch work.
