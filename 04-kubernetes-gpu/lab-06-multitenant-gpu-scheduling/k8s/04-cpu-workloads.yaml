apiVersion: apps/v1
kind: Deployment
metadata:
  name: interactive-inference
  namespace: ai-team-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: interactive-inference
  template:
    metadata:
      labels:
        app: interactive-inference
    spec:
      priorityClassName: ai-interactive
      containers:
        - name: inference
          image: busybox:1.36
          command: ["sh", "-c", "while true; do echo inference-ready; sleep 60; done"]
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 300m, memory: 128Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: batch-training
  namespace: ai-team-b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: batch-training
  template:
    metadata:
      labels:
        app: batch-training
    spec:
      priorityClassName: ai-batch
      containers:
        - name: trainer
          image: busybox:1.36
          command: ["sh", "-c", "while true; do echo batch-running; sleep 60; done"]
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 300m, memory: 128Mi}
