apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gpuworkloads.training.example.com
spec:
  group: training.example.com
  scope: Namespaced
  names:
    plural: gpuworkloads
    singular: gpuworkload
    kind: GPUWorkload
    shortNames:
      - gw
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - gpuCount
                - image
              properties:
                gpuCount:
                  type: integer
                  minimum: 1
                image:
                  type: string
                  minLength: 1
