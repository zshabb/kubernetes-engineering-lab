apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: gpu-observability
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.gpu-observability.svc.cluster.local:9090
        isDefault: true
        editable: false
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: GPU Lab
        orgId: 1
        folder: GPU Lab
        type: file
        disableDeletion: true
        options:
          path: /var/lib/grafana/dashboards
