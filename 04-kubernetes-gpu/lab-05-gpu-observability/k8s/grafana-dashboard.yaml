apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard
  namespace: gpu-observability
data:
  gpu.json: |
    {
      "title": "GPU Observability (Simulated)",
      "uid": "gpu-lab05",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "GPU Utilization",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "DCGM_FI_DEV_GPU_UTIL",
              "refId": "A"
            }
          ],
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 9
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent"
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "GPU Memory Used (MiB)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "DCGM_FI_DEV_FB_USED",
              "refId": "A"
            }
          ],
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 9
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none"
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "GPU Temperature (\u00b0C)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "DCGM_FI_DEV_GPU_TEMP",
              "refId": "A"
            }
          ],
          "gridPos": {
            "x": 0,
            "y": 9,
            "w": 12,
            "h": 9
          },
          "fieldConfig": {
            "defaults": {
              "unit": "celsius"
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Exporter Health",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "up{job=\"simulated-dcgm\"}",
              "refId": "A"
            }
          ],
          "gridPos": {
            "x": 12,
            "y": 9,
            "w": 12,
            "h": 9
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none"
            },
            "overrides": []
          },
          "options": {}
        }
      ]
    }
