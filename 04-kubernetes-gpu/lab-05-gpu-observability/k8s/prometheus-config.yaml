apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: gpu-observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
      evaluation_interval: 10s
    rule_files:
      - /etc/prometheus/rules.yml
    scrape_configs:
      - job_name: simulated-dcgm
        static_configs:
          - targets: ['simulated-dcgm.gpu-observability.svc.cluster.local:9400']
  rules.yml: |
    groups:
      - name: gpu-simulation
        rules:
          - alert: GPUExporterUnavailable
            expr: up{job="simulated-dcgm"} == 0
            for: 30s
            labels: {severity: critical}
            annotations: {summary: "Simulated DCGM exporter unavailable"}
          - alert: GPUMemoryPressure
            expr: DCGM_FI_DEV_FB_USED / (DCGM_FI_DEV_FB_USED + DCGM_FI_DEV_FB_FREE) > 0.85
            for: 1m
            labels: {severity: warning}
            annotations: {summary: "Simulated GPU memory usage above 85%"}
          - alert: GPUHighTemperature
            expr: DCGM_FI_DEV_GPU_TEMP > 80
            for: 1m
            labels: {severity: warning}
            annotations: {summary: "Simulated GPU temperature above 80 C"}
