apiVersion: v1
kind: Pod
metadata:
  name: guaranteed-test
spec:
  restartPolicy: Never
  containers:
    - name: stress
      image: polinux/stress
      command: ["sleep"]
      args: ["3600"]
      resources:
        requests:
          memory: "64Mi"
          cpu: "200m"
        limits:
          memory: "64Mi"
          cpu: "200m"
