apiVersion: v1
kind: Pod
metadata:
  name: cpu-test
  labels:
    app: cpu-test
spec:
  containers:
    - name: stress
      image: polinux/stress
      command: ["stress"]
      args: ["--cpu", "2"]
      resources:
        requests:
          cpu: "100m"
          memory: "32Mi"
        limits:
          memory: "128Mi"
